<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>スタッフ管理</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #333;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        YuGothic,
        Arial,
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      color: #222;
    }

    .header p {
      margin: 7px 0 0;
      color: #888;
      font-size: 14px;
    }

    /* =========================
       ホームメニュー
    ========================= */

    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 30px;
    }

    .menu-card {
      width: 100%;
      border: none;
      border-radius: 18px;
      background: #fff;
      padding: 25px 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease;
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .menu-title {
      font-size: 21px;
      font-weight: 700;
      color: #222;
    }

    .menu-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #999;
    }

    /* =========================
       ページ
    ========================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .back-button {
      width: 100%;
      border: none;
      background: transparent;
      color: #777;
      font-size: 14px;
      padding: 8px 0 18px;
      text-align: left;
      cursor: pointer;
    }

    .section {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #222;
    }

    /* =========================
       時計
    ========================= */

    .clock-box {
      text-align: center;
      padding: 8px 0 20px;
    }

    .today-date {
      font-size: 18px;
      font-weight: 600;
      color: #777;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .clock {
      font-size: 42px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 1px;
      color: #222;
    }

    /* =========================
       スタッフ
    ========================= */

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .staff-button {
      border: 1px solid #e5e5e5;
      background: #fff;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
    }

    .staff-button.selected {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .action-button {
      border: none;
      border-radius: 14px;
      padding: 17px 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .clock-in {
      background: #222;
      color: #fff;
    }

    .clock-out {
      background: #eee;
      color: #222;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f3f3f3;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    /* =========================
       打刻记录
    ========================= */

    .record {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .record-time {
      font-size: 14px;
      color: #777;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
    }

    /* =========================
       売上
    ========================= */

    .sales-total {
      text-align: center;
      padding: 15px 0 22px;
    }

    .sales-total-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 5px;
    }

    .sales-total-amount {
      font-size: 38px;
      font-weight: 700;
      color: #222;
    }

    .sales-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-box {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .summary-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 20px;
      font-weight: 700;
    }

    .sales-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .sales-row:last-child {
      border-bottom: none;
    }

    .sales-name {
      font-weight: 600;
      font-size: 15px;
    }

    .sales-amount {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .payment-name {
      font-size: 14px;
      color: #555;
    }

    .payment-amount {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .refresh-text {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 12px;
    }

    /* =========================
       PC
    ========================= */

    @media (min-width: 700px) {
      .app {
        padding-top: 35px;
      }

      .staff-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       HOME
  ========================= -->

  <div id="homePage" class="page active">

    <div class="header">
      <h1>スタッフ管理</h1>
      <p>スタッフ打刻・当日対账</p>
    </div>

    <div class="menu">

      <button class="menu-card" onclick="showPage('clockPage')">
        <div class="menu-icon">🕐</div>
        <div class="menu-title">打刻</div>
        <div class="menu-subtitle">出勤・退勤の打刻</div>
      </button>

      <button class="menu-card" onclick="showPage('salesPage'); loadTodaySales();">
        <div class="menu-icon">💰</div>
        <div class="menu-title">当日対账</div>
        <div class="menu-subtitle">本日の売上・支払方法を確認</div>
      </button>

    </div>

  </div>


  <!-- =========================
       CLOCK PAGE
  ========================= -->

  <div id="clockPage" class="page">

    <button class="back-button" onclick="showPage('homePage')">
      ← メニュー
    </button>

    <div class="header">
      <h1>スタッフ打刻</h1>
      <p>出勤・退勤を登録してください</p>
    </div>


    <!-- 時計 -->

    <div class="section">

      <div class="clock-box">

        <!-- 当日日期 -->
        <div id="todayDate" class="today-date">
          ----年--月--日（-）
        </div>

        <!-- 当前时间 -->
        <div id="clock" class="clock">
          --:--:--
        </div>

      </div>

    </div>


    <!-- スタッフ選択 -->

    <div class="section">

      <div class="section-title">
        スタッフを選択
      </div>

      <div id="staffGrid" class="staff-grid">
        <!-- JS -->
      </div>

      <div class="action-row">

        <button
          class="action-button clock-in"
          onclick="clockIn()"
        >
          出勤
        </button>

        <button
          class="action-button clock-out"
          onclick="clockOut()"
        >
          退勤
        </button>

      </div>

      <div id="message" class="message"></div>

    </div>


    <!-- 今日の打刻 -->

    <div class="section">

      <div class="section-title">
        今日の打刻
      </div>

      <div id="todayRecords">
        <div class="empty">
          読み込み中...
        </div>
      </div>

    </div>

  </div>


  <!-- =========================
       SALES PAGE
  ========================= -->

  <div id="salesPage" class="page">

    <button class="back-button" onclick="showPage('homePage')">
      ← メニュー
    </button>

    <div class="header">
      <h1>当日対账</h1>
      <p>本日の売上状況</p>
    </div>


    <!-- 売上合計 -->

    <div class="section">

      <div class="sales-total">

        <div class="sales-total-label">
          本日の売上
        </div>

        <div id="salesTotal" class="sales-total-amount">
          ¥0
        </div>

      </div>


      <div class="sales-summary">

        <div class="summary-box">
          <div class="summary-label">
            件数
          </div>

          <div id="orderCount" class="summary-value">
            0
          </div>
        </div>


        <div class="summary-box">
          <div class="summary-label">
            支払件数
          </div>

          <div id="paymentCount" class="summary-value">
            0
          </div>
        </div>

      </div>

    </div>


    <!-- スタッフ別売上 -->

    <div class="section">

      <div class="section-title">
        スタッフ別売上
      </div>

      <div id="staffSales">
        <div class="empty">
          読み込み中...
        </div>
      </div>

    </div>


    <!-- 支払方法 -->

    <div class="section">

      <div class="section-title">
        支払方法別
      </div>

      <div id="paymentSales">
        <div class="empty">
          読み込み中...
        </div>
      </div>

      <div class="refresh-text">
        60秒ごとに自動更新
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     Supabase
  ========================= */

  const SUPABASE_URL =
    "https://isspcmbqmwgvchkttief.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_5V4yaPwaEzSRXbN054Qyag_MpT7EZtX";


  /* =========================
     状態
  ========================= */

  let staffList = [];
  let selectedStaffId = null;

  let salesRefreshTimer = null;


  /* =========================
     ページ切り替え
  ========================= */

  function showPage(pageId) {

    document.querySelectorAll(".page").forEach(page => {
      page.classList.remove("active");
    });

    const target = document.getElementById(pageId);

    if (target) {
      target.classList.add("active");
    }

    if (pageId !== "salesPage") {

      if (salesRefreshTimer) {
        clearInterval(salesRefreshTimer);
        salesRefreshTimer = null;
      }

    }

    if (pageId === "salesPage") {

      loadTodaySales();

      if (!salesRefreshTimer) {

        salesRefreshTimer = setInterval(() => {

          const salesPage =
            document.getElementById("salesPage");

          if (
            salesPage &&
            salesPage.classList.contains("active")
          ) {
            loadTodaySales();
          }

        }, 60000);

      }

    }

  }


  /* =========================
     API
  ========================= */

  async function apiFetch(
    table,
    options = {}
  ) {

    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table;

    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    const response =
      await fetch(
        url + (options.query || ""),
        {
          method: options.method || "GET",
          headers,
          body:
            options.body
              ? JSON.stringify(options.body)
              : undefined
        }
      );

    if (!response.ok) {

      const text =
        await response.text();

      throw new Error(text || "API Error");

    }

    const text =
      await response.text();

    return text ? JSON.parse(text) : [];

  }


  /* =========================
     日本時間
  ========================= */

  function getJapanDate() {

    return new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).format(
      new Date()
    );

  }


  /* =========================
     日本語曜日
  ========================= */

  function getJapanDateDisplay() {

    const now = new Date();

    const formatter =
      new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "numeric",
          day: "numeric",
          weekday: "short"
        }
      );

    return formatter.format(now);

  }


  /* =========================
     時計
  ========================= */

  function updateClock() {

    const now = new Date();

    const timeFormatter =
      new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone: "Asia/Tokyo",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }
      );

    const time =
      timeFormatter.format(now);

    const dateFormatter =
      new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "numeric",
          day: "numeric",
          weekday: "short"
        }
      );

    const date =
      dateFormatter.format(now);


    const clock =
      document.getElementById("clock");

    const todayDate =
      document.getElementById("todayDate");


    if (clock) {
      clock.textContent = time;
    }

    if (todayDate) {
      todayDate.textContent = date;
    }

  }


  /* =========================
     メッセージ
  ========================= */

  function showMessage(
    message,
    isError = false
  ) {

    const box =
      document.getElementById("message");

    if (!box) return;

    box.textContent = message;

    box.style.background =
      isError
        ? "#fff0f0"
        : "#f3f3f3";

    box.style.color =
      isError
        ? "#c62828"
        : "#333";

    box.classList.add("show");

    setTimeout(() => {
      box.classList.remove("show");
    }, 3000);

  }


  /* =========================
     スタッフ読み込み
  ========================= */

  async function loadStaff() {

    try {

      staffList =
        await apiFetch(
          "staff",
          {
            query:
              "?select=id,name,active,sort_order" +
              "&active=eq.true" +
              "&order=sort_order.asc"
          }
        );


      renderStaff();

    } catch (error) {

      console.error(error);

      showMessage(
        "スタッフ情報を読み込めませんでした。",
        true
      );

    }

  }


  /* =========================
     スタッフ表示
  ========================= */

  function renderStaff() {

    const grid =
      document.getElementById("staffGrid");

    if (!grid) return;

    grid.innerHTML = "";


    staffList.forEach(staff => {

      const button =
        document.createElement("button");

      button.className =
        "staff-button";

      button.textContent =
        staff.name;

      button.onclick =
        () => selectStaff(staff.id);

      if (
        selectedStaffId === staff.id
      ) {
        button.classList.add("selected");
      }

      grid.appendChild(button);

    });

  }


  /* =========================
     スタッフ選択
  ========================= */

  function selectStaff(staffId) {

    selectedStaffId = staffId;

    localStorage.setItem(
      "mona_selected_staff",
      staffId
    );

    renderStaff();

  }


  /* =========================
     出勤
  ========================= */

  async function clockIn() {

    if (!selectedStaffId) {

      showMessage(
        "スタッフを選択してください。",
        true
      );

      return;

    }


    const today =
      getJapanDate();


    try {

      /*
       * 今日の打刻を確認
       */

      const existing =
        await apiFetch(
          "attendance",
          {
            query:
              "?select=id,clock_in,clock_out" +
              "&staff_id=eq." +
              encodeURIComponent(selectedStaffId) +
              "&work_date=eq." +
              today
          }
        );


      /*
       * すでに出勤済み
       */

      if (
        existing.length > 0 &&
        existing[0].clock_in
      ) {

        showMessage(
          "本日はすでに出勤打刻されています。",
          true
        );

        await loadTodayRecords();

        return;

      }


      const now =
        new Date().toISOString();


      /*
       * 今日のレコードがあるが
       * clock_in が空の場合
       */

      if (existing.length > 0) {

        await apiFetch(
          "attendance?id=eq." +
          encodeURIComponent(existing[0].id),
          {
            method: "PATCH",
            body: {
              clock_in: now
            }
          }
        );

      } else {

        /*
         * 新規作成
         */

        await apiFetch(
          "attendance",
          {
            method: "POST",
            body: {
              staff_id: selectedStaffId,
              work_date: today,
              clock_in: now
            }
          }
        );

      }


      showMessage(
        "出勤打刻しました。"
      );


      await loadTodayRecords();


    } catch (error) {

      console.error(error);

      showMessage(
        "出勤打刻に失敗しました。",
        true
      );

    }

  }


  /* =========================
     退勤
  ========================= */

  async function clockOut() {

    if (!selectedStaffId) {

      showMessage(
        "スタッフを選択してください。",
        true
      );

      return;

    }


    const today =
      getJapanDate();


    try {

      const records =
        await apiFetch(
          "attendance",
          {
            query:
              "?select=id,clock_in,clock_out" +
              "&staff_id=eq." +
              encodeURIComponent(selectedStaffId) +
              "&work_date=eq." +
              today +
              "&clock_out=is.null" +
              "&order=clock_in.desc" +
              "&limit=1"
          }
        );


      if (records.length === 0) {

        showMessage(
          "本日の出勤記録がありません。",
          true
        );

        return;

      }


      const now =
        new Date().toISOString();


      await apiFetch(
        "attendance?id=eq." +
        encodeURIComponent(records[0].id),
        {
          method: "PATCH",
          body: {
            clock_out: now
          }
        }
      );


      showMessage(
        "退勤打刻しました。"
      );


      await loadTodayRecords();


    } catch (error) {

      console.error(error);

      showMessage(
        "退勤打刻に失敗しました。",
        true
      );

    }

  }


  /* =========================
     時刻表示
  ========================= */

  function formatTime(value) {

    if (!value) {
      return "--:--";
    }


    const date =
      new Date(value);


    return new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: "Asia/Tokyo",
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(date);

  }


  /* =========================
     今日の打刻
  ========================= */

  async function loadTodayRecords() {

    const container =
      document.getElementById(
        "todayRecords"
      );

    if (!container) return;


    try {

      const today =
        getJapanDate();


      const records =
        await apiFetch(
          "attendance",
          {
            query:
              "?select=id,staff_id,work_date,clock_in,clock_out" +
              "&work_date=eq." +
              today +
              "&order=clock_in.asc"
          }
        );


      if (records.length === 0) {

        container.innerHTML =
          '<div class="empty">まだ打刻記録がありません。</div>';

        return;

      }


      const staffMap = {};

      staffList.forEach(staff => {
        staffMap[staff.id] =
          staff.name;
      });


      container.innerHTML = "";


      records.forEach(record => {

        const div =
          document.createElement("div");

        div.className =
          "record";


        const name =
          staffMap[record.staff_id] ||
          "スタッフ";


        div.innerHTML = `
          <div class="record-name">
            ${escapeHtml(name)}
          </div>

          <div class="record-time">
            出勤：${formatTime(record.clock_in)}
           　
            退勤：${formatTime(record.clock_out)}
          </div>
        `;


        container.appendChild(div);

      });


    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="empty">読み込みに失敗しました。</div>';

    }

  }


  /* =========================
     今日の売上
  ========================= */

  async function loadTodaySales() {

    try {

      const today =
        getJapanDate();


      /*
       * service_records
       */

      const records =
        await apiFetch(
          "service_records",
          {
            query:
              "?select=id,staff_id,service_date,service_time,customer_name" +
              "&service_date=eq." +
              today +
              "&order=service_time.asc"
          }
        );


      /*
       * service_payments
       */

      const payments =
        await apiFetch(
          "service_payments",
          {
            query:
              "?select=id,service_record_id,payment_method,amount" +
              "&order=id.asc"
          }
        );


      /*
       * 今日の record ID
       */

      const recordIds =
        new Set(
          records.map(
            record => record.id
          )
        );


      /*
       * 今日の payment のみ
       */

      const todayPayments =
        payments.filter(
          payment =>
            recordIds.has(
              payment.service_record_id
            )
        );


      /*
       * 売上合計
       */

      const total =
        todayPayments.reduce(
          (sum, payment) =>
            sum + Number(payment.amount || 0),
          0
        );


      /*
       * 表示
       */

      const totalElement =
        document.getElementById(
          "salesTotal"
        );

      if (totalElement) {

        totalElement.textContent =
          "¥" +
          total.toLocaleString("ja-JP");

      }


      const orderCount =
        document.getElementById(
          "orderCount"
        );

      if (orderCount) {

        orderCount.textContent =
          records.length;

      }


      const paymentCount =
        document.getElementById(
          "paymentCount"
        );

      if (paymentCount) {

        paymentCount.textContent =
          todayPayments.length;

      }


      renderStaffSales(
        records,
        todayPayments
      );


      renderPaymentSales(
        todayPayments
      );


    } catch (error) {

      console.error(error);

      const totalElement =
        document.getElementById(
          "salesTotal"
        );

      if (totalElement) {
        totalElement.textContent =
          "読み込みエラー";
      }

    }

  }


  /* =========================
     スタッフ別売上
  ========================= */

  function renderStaffSales(
    records,
    payments
  ) {

    const container =
      document.getElementById(
        "staffSales"
      );

    if (!container) return;


    if (staffList.length === 0) {

      container.innerHTML =
        '<div class="empty">スタッフがありません。</div>';

      return;

    }


    const totals = {};


    staffList.forEach(staff => {

      totals[staff.id] = 0;

    });


    const recordStaffMap = {};


    records.forEach(record => {

      recordStaffMap[record.id] =
        record.staff_id;

    });


    payments.forEach(payment => {

      const staffId =
        recordStaffMap[
          payment.service_record_id
        ];


      if (
        staffId &&
        totals[staffId] !== undefined
      ) {

        totals[staffId] +=
          Number(payment.amount || 0);

      }

    });


    container.innerHTML = "";


    staffList.forEach(staff => {

      const row =
        document.createElement("div");

      row.className =
        "sales-row";


      row.innerHTML = `
        <div class="sales-name">
          ${escapeHtml(staff.name)}
        </div>

        <div class="sales-amount">
          ¥${totals[staff.id].toLocaleString("ja-JP")}
        </div>
      `;


      container.appendChild(row);

    });

  }


  /* =========================
     支払方法別売上
  ========================= */

  function renderPaymentSales(
    payments
  ) {

    const container =
      document.getElementById(
        "paymentSales"
      );

    if (!container) return;


    const methods = [
      "現金",
      "PayPay",
      "クレジットカード",
      "ポイント",
      "スマート"
    ];


    const totals = {};


    methods.forEach(method => {

      totals[method] = 0;

    });


    payments.forEach(payment => {

      const method =
        payment.payment_method;


      if (
        totals[method] !== undefined
      ) {

        totals[method] +=
          Number(payment.amount || 0);

      }

    });


    container.innerHTML = "";


    methods.forEach(method => {

      const row =
        document.createElement("div");

      row.className =
        "sales-row";


      row.innerHTML = `
        <div class="payment-name">
          ${escapeHtml(method)}
        </div>

        <div class="payment-amount">
          ¥${totals[method].toLocaleString("ja-JP")}
        </div>
      `;


      container.appendChild(row);

    });

  }


  /* =========================
     HTMLエスケープ
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     初期化
  ========================= */

  async function init() {

    /*
     * 保存されたスタッフを復元
     */

    const savedStaff =
      localStorage.getItem(
        "mona_selected_staff"
      );


    if (savedStaff) {

      selectedStaffId =
        savedStaff;

    }


    /*
     * 時計開始
     */

    updateClock();

    setInterval(
      updateClock,
      1000
    );


    /*
     * スタッフ読み込み
     */

    await loadStaff();


    /*
     * 今日の打刻
     */

    await loadTodayRecords();

  }


  /* =========================
     START
  ========================= */

  init();

</script>

</body>
</html>
